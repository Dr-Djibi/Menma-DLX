<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MENMA DLX</title>
    <meta name="description" content="Téléchargeur vidéo universel — TikTok, YouTube, Instagram, Facebook, Pinterest">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d1117">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Bannière presse-papier (Feature 2) -->
    <div class="clipboard-banner hidden" id="clipboardBanner">
        <span id="clipboardBannerText">🔗 Lien détecté</span>
        <button id="clipboardBannerBtn">Télécharger →</button>
        <button class="clipboard-banner-close" id="clipboardBannerClose">✕</button>
    </div>

    <canvas id="confettiCanvas"></canvas>
    <main class="container glass">
        <header>
            <div class="header-row">
                <h1 class="logo">MENMA <span>DLX</span></h1>
                <div class="header-actions">
                    <button class="share-btn" id="shareAppBtn" title="Partager l'appli">🔗</button>
                    <button class="theme-toggle" id="themeToggle" aria-label="Changer de thème">☀️</button>
                </div>
            </div>
            <p class="subtitle">TikTok · YouTube · Instagram · Facebook · Pinterest</p>
            <!-- Compteur (Feature 5) -->
            <div class="dl-counter" id="dlCounter">🔥 <span id="dlCount">0</span> vidéos téléchargées</div>
        </header>

        <form id="downloadForm">
            <div class="input-wrap">
                <input
                    type="url"
                    id="urlInput"
                    placeholder="Colle le lien de la vidéo ici…"
                    autocomplete="off"
                    autocorrect="off"
                    spellcheck="false"
                    required
                >
                <button type="button" id="pasteBtn" title="Coller depuis le presse-papier">📋</button>
            </div>
            <div id="platformHint" class="platform-hint"></div>
            
            <div class="format-toggle">
                <span class="toggle-label" id="labelVideo">🎬 Vidéo</span>
                <label class="switch">
                    <input type="checkbox" id="formatToggle">
                    <span class="slider round"></span>
                </label>
                <span class="toggle-label" id="labelAudio">🎵 Audio</span>
            </div>

            <button type="submit" id="submitBtn">
                <span class="btn-text">⬇️ Obtenir le média</span>
                <span class="loader hidden"></span>
            </button>

            <!-- Barre de progression -->
            <div class="progress-wrap hidden" id="progressWrap">
                <div class="progress-bar" id="progressBar"></div>
                <span class="progress-label" id="progressLabel">Connexion…</span>
            </div>
        </form>

        <!-- Historique -->
        <div class="history-wrap hidden" id="historyWrap">
            <h3><span class="icon">🕒</span> Récents</h3>
            <div class="history-gallery" id="historyGallery"></div>
        </div>

        <!-- Résultat -->
        <div id="resultCard" class="result-card hidden">
            <div class="platform-badge" id="platformBadge"></div>
            <p id="videoTitle"></p>
            <img id="thumbImg" class="thumb hidden" alt="Aperçu">

            <a id="downloadLink" href="#" class="download-btn" download>💾 Télécharger</a>
            <div id="allMediaList" class="media-list"></div>
        </div>

        <div id="errorMsg" class="error-msg hidden"></div>

        <footer>
            <p>Propulsé par <span style="color: var(--accent); font-weight: 600;">Dr Djibi</span> · <span id="year"></span></p>
        </footer>
    </main>

    <script src="/app.js" defer></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    </script>
</body>
</html>
