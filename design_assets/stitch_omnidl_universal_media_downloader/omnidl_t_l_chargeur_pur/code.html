-symbols-outlined text-[16px]">signal_cellular_4_bar</span><span class="material-symbols-outlined text-[16px]">wifi</span><span class="material-symbols-outlined text-[18px]">battery_charging_full</span></div></div><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-lg overflow-hidden flex items-center justify-center shrink-0"><img alt="OmniDL" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1VtL5H1iytumEMUQl2d__TqfGUKponFDxDtYhZQDY6ERRyZf6-Pamw6EHJjwzwhRqWF1ObrRaegSArcsJOppViMVC2ks8qAIga_sLR_P3BhKrfG72sAbXW2khfFOMz62yWHMoAzsej-Ummzjk4f8HjgDNfmBWwfdiGZhyi88DIhqze2VKh8guK4Vje4gh_JY0yPzP9hJyO6TktYTNqS8is1X4jNi8VPzc6bZqcaZZCRQ3tmLh9S7UmuPHwu"/></div><span class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">OmniDL</span></div><div class="flex items-center gap-space-xs"><button aria-label="Historique" class="w-10 h-10 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors"><span class="material-symbols-outlined text-[20px]">history</span></button><button aria-label="Paramètres" class="w-10 h-10 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors"><span class="material-symbols-outlined text-[20px]">settings</span></button></div></div></header><main class="flex-1 w-full bg-surface pt-16 pb-24 px-margin"><div class="flex flex-col w-full space-y-space-lg pb-10">
<!-- Section Titre & Statut (Header Content) -->
<div class="flex flex-col gap-1 pt-2"><h1 class="text-[22px] font-semibold tracking-tight text-on-surface">Téléchargement</h1><p class="font-body-sm text-on-surface-variant">Téléchargez vidéos et audios à partir d'un lien.</p></div>
<!-- Zone de saisie principale (Hero Input) -->
<section class="flex flex-col gap-space-sm"><div class="relative flex items-center rounded-xl bg-surface-container-low border border-outline-variant/30 p-1.5 focus-within:border-primary transition-colors"><span class="material-symbols-outlined text-outline px-2 text-[20px]">link</span><input class="w-full bg-transparent text-on-surface font-body-md focus:outline-none placeholder:text-outline" id="url-field" placeholder="Coller un lien..." type="text" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ"/><button class="shrink-0 px-3 py-1.5 rounded-lg bg-surface-container-high text-on-surface font-label-md text-label-md hover:bg-surface-variant transition-colors" id="paste-btn" type="button">Coller</button></div></section>
<!-- Options de conversion & extraction -->
<div class="grid grid-cols-2 gap-2 p-1 rounded-xl bg-surface-container-low"><button class="py-2 px-3 rounded-lg bg-surface-container-high text-on-surface font-label-md text-label-md text-center transition-colors" id="btn-format-video" type="button">Vidéo</button><button class="py-2 px-3 rounded-lg bg-transparent text-on-surface-variant hover:text-on-surface font-label-md text-label-md text-center transition-colors" id="btn-format-audio" type="button">Audio</button></div>
<!-- CTA Principal d'Extraction -->
<button class="w-full py-3 px-4 rounded-xl bg-primary text-on-primary font-headline-sm text-[14px] flex items-center justify-center gap-2 hover:opacity-95 active:scale-[0.98] transition-all" id="extract-cta" type="button"><span class="material-symbols-outlined text-[18px]">download</span><span>Télécharger le média</span></button>

<section class="flex flex-col rounded-xl bg-surface-container-low border border-outline-variant/20 p-space-md gap-space-sm"><div class="relative w-full aspect-video rounded-lg overflow-hidden bg-surface-container-lowest"><img alt="Cyberpunk Neo-Tokyo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXAp71ZlGNZ0NUAeL8O7kn2OPTF2x4JkKOPif65SvW66Qia89K1jIBb0D1UBrv5CffPpCLC0QAIGQt_5vGUhFoZ4IXtqaV0GBJOqOovgyj0zvydloBdop93tXncgG11ADuy10YUQJKjPzP41HOtWOXsglGhAZ-Q1IljOCQSsHxPuTYB4nnuoFmCyDMdf1tMUAih50A6yP4h7p4mchK96_J-icwEuPX8gehhoAH_yNqwLtWeUmqPkZTkw"/><div class="absolute bottom-2 right-2 px-2 py-0.5 rounded bg-black/80 text-white font-label-sm text-label-sm">04:18</div></div><div class="flex flex-col gap-0.5"><h2 class="font-headline-sm text-[15px] text-on-surface truncate">Cyberpunk Neo-Tokyo Cityscape</h2><span class="font-body-sm text-body-sm text-on-surface-variant">NeoVisions • MP4 (1080p)</span></div><button class="w-full py-2.5 px-4 rounded-lg bg-surface-container-high text-on-surface font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors" id="save-device-btn" type="button"><span class="material-symbols-outlined text-[18px]">download_done</span><span>Enregistrer</span></button></section>
<!-- Panneau Diagnostics Télémétrie / Logs Micro-Terminal -->
</div>
<script>
  (function() {
    const urlInput = document.getElementById('url-field');
    const clearBtn = document.getElementById('clear-btn');
    const pasteBtn = document.getElementById('paste-btn');
    const btnVideo = document.getElementById('btn-format-video');
    const btnAudio = document.getElementById('btn-format-audio');
    const btnHd = document.getElementById('btn-quality-hd');
    const btnSd = document.getElementById('btn-quality-sd');
    const extractBtn = document.getElementById('extract-cta');
    const saveBtn = document.getElementById('save-device-btn');

    if (clearBtn && urlInput) {
      clearBtn.addEventListener('click', () => {
        urlInput.value = '';
        urlInput.focus();
      });
    }

    if (pasteBtn && urlInput) {
      pasteBtn.addEventListener('click', async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const clipText = await navigator.clipboard.readText();
            if (clipText) urlInput.value = clipText;
          } else {
            urlInput.value = 'https://tiktok.com/@cyber/video/729104882194';
          }
        } catch (e) {
          urlInput.value = 'https://tiktok.com/@cyber/video/729104882194';
        }
      });
    }

    if (btnVideo && btnAudio) {
      btnVideo.addEventListener('click', () => {
        btnVideo.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg bg-gradient-to-r from-primary-container to-secondary-container text-on-primary font-headline-sm text-[14px] shadow-[0_0_12px_rgba(160,120,255,0.4)] transition-all";
        btnAudio.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg bg-transparent text-on-surface-variant hover:text-on-surface font-headline-sm text-[14px] transition-all";
      });

      btnAudio.addEventListener('click', () => {
        btnAudio.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg bg-gradient-to-r from-primary-container to-secondary-container text-on-primary font-headline-sm text-[14px] shadow-[0_0_12px_rgba(160,120,255,0.4)] transition-all";
        btnVideo.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg bg-transparent text-on-surface-variant hover:text-on-surface font-headline-sm text-[14px] transition-all";
      });
    }

    if (btnHd && btnSd) {
      btnHd.addEventListener('click', () => {
        btnHd.className = "flex flex-col items-start p-2.5 rounded-xl bg-surface-container-high shadow-[0_0_14px_rgba(76,215,246,0.18)] transition-all";
        btnSd.className = "flex flex-col items-start p-2.5 rounded-xl bg-surface-container-lowest opacity-75 hover:opacity-100 transition-all";
      });

      btnSd.addEventListener('click', () => {
        btnSd.className = "flex flex-col items-start p-2.5 rounded-xl bg-surface-container-high shadow-[0_0_14px_rgba(76,215,246,0.18)] transition-all";
        btnHd.className = "flex flex-col items-start p-2.5 rounded-xl bg-surface-container-lowest opacity-75 hover:opacity-100 transition-all";
      });
    }

    if (extractBtn) {
      extractBtn.addEventListener('click', () => {
        const originalContent = extractBtn.innerHTML;
        extractBtn.innerHTML = `
          <span class="material-symbols-outlined text-[24px] animate-spin">sync</span>
          <span>Extraction en cours...</span>
        `;
        setTimeout(() => {
          extractBtn.innerHTML = `
            <span class="material-symbols-outlined text-[24px]">check_circle</span>
            <span>Média Actualisé !</span>
          `;
          setTimeout(() => {
            extractBtn.innerHTML = originalContent;
          }, 1500);
        }, 1200);
      });
    }

    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        const currentHtml = saveBtn.innerHTML;
        saveBtn.innerHTML = `
          <span class="material-symbols-outlined text-[20px] animate-bounce">downloading</span>
          <span>Enregistrement...</span>
        `;
        setTimeout(() => {
          saveBtn.innerHTML = `
            <span class="material-symbols-outlined text-[20px]">done_all</span>
            <span>Fichier Enregistré dans Médias</span>
          `;
          setTimeout(() => {
            saveBtn.innerHTML = currentHtml;
          }, 2000);
        }, 1400);
      });
    }
  })();
